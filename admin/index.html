<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon-large.png" sizes="96x96" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14151c" media="(prefers-color-scheme: dark)" />
  <title>The Journalism Admin</title>

  <!-- fonts (preconnect + swap: no render-blocking @import) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@300..800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- apply the saved / system theme before first paint (no light-mode flash) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved === "dark" || ((!saved || saved === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
